<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח בקרת שיעורים | ישיבת מדברה כעדן</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    /* Admin Dashboard Specific Layout */
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px 20px;
    }

    /* Top Navigation Header */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Tab Navigation */
    .tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tab-btn:hover {
      background: var(--bg-input);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .tab-badge {
      background: var(--primary);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
    }

    .tab-badge.badge-alert {
      background: var(--accent);
    }

    /* Sorting Queue Item Card */
    .queue-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .queue-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .queue-card.has-alert {
      border-right: 6px solid var(--accent);
    }

    .file-meta-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .file-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attached-note-box {
      background: var(--warning-light);
      border: 1px solid var(--warning-border);
      border-radius: var(--border-radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .note-icon {
      font-size: 20px;
      color: var(--warning);
      margin-top: 2px;
    }

    .audio-player-container {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    audio {
      width: 100%;
      height: 38px;
      outline: none;
    }

    /* Grid for Classification Inputs */
    .classification-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) auto;
      gap: 14px;
      align-items: flex-end;
      background: #fafbfc;
      padding: 16px;
      border-radius: var(--border-radius-md);
      border: 1px solid #edf2f7;
    }

    /* Custom Rabbi Selector / Input combo */
    .rabbi-select-wrapper {
      position: relative;
    }

    /* Empty States */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: var(--border-radius-lg);
      border: 1px dashed var(--border-color);
    }

    .empty-state-icon {
      font-size: 48px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div class="modal-backdrop" id="loginModal" style="display: none;">
    <div class="modal-content">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
        <h2 style="font-size: 22px;">כניסת אחראי שיעורים</h2>
        <p style="font-size: 14px; color: var(--text-secondary); margin-top: 4px;">
          הזן סיסמת מנהל לגישה ללוח הבקרה והמיון
        </p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="passwordInput">סיסמת גישה:</label>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="loginBtn">
          התחבר למערכת
        </button>
      </form>
    </div>
  </div>

  <!-- Main Dashboard Container -->
  <div class="dashboard-container" id="dashboardView" style="display: none;">
    
    <!-- Top Navigation Header -->
    <header class="top-navbar">
      <div class="brand-title">
        <div class="brand-icon">🎙️</div>
        <div>
          <h1 style="font-size: 20px; margin-bottom: 2px;">מערכת מיון שיעורים</h1>
          <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">ישיבת מדברה כעדן • מצפה רמון</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-secondary btn-sm" id="refreshBtn" title="רענן נתונים">
          <span>🔄 רענן</span>
        </button>
        <button class="btn btn-secondary btn-sm" id="logoutBtn" title="התנתק">
          <span>🚪 יציאה</span>
        </button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-bar">
      <button class="tab-btn active" id="tabQueueBtn" onclick="switchTab('queue')">
        <span>שיעורים למיון</span>
        <span class="tab-badge" id="queueCountBadge">0</span>
      </button>
      <button class="tab-btn" id="tabNotesBtn" onclick="switchTab('notes')">
        <span>תיבת הערות והתראות</span>
        <span class="tab-badge badge-alert" id="notesCountBadge">0</span>
      </button>
    </nav>

    <!-- TAB 1: Queue (שיעורים למיון) -->
    <main id="queueTabContent">
      <div id="queueList">
        <!-- Dynamically injected queue cards -->
      </div>
    </main>

    <!-- TAB 2: Notes & Alerts Inbox (תיבת הערות) -->
    <main id="notesTabContent" style="display: none;">
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-primary btn-sm" id="filterOpenNotesBtn" onclick="filterNotes('open')">הערות פתוחות</button>
        <button class="btn btn-secondary btn-sm" id="filterAllNotesBtn" onclick="filterNotes('all')">כל ההערות</button>
      </div>
      <div id="notesList">
        <!-- Dynamically injected notes cards -->
      </div>
    </main>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
