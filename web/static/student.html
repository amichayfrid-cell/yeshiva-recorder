<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>השארת הערה לשיעור | ישיבת מדברה כעדן</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }

    .student-card {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 36px 32px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .header-icon {
      width: 52px;
      height: 52px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
      border: 1px solid var(--primary-border);
    }

    .file-badge-container {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 12px 16px;
      border-radius: var(--border-radius-md);
      margin: 18px 0 24px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-icon {
      font-size: 20px;
      color: #64748b;
    }

    .file-name {
      font-family: 'Assistant', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-all;
    }

    .success-box {
      display: none;
      text-align: center;
      padding: 30px 10px;
      animation: fadeIn 0.3s ease;
    }

    .success-icon {
      font-size: 56px;
      color: var(--success);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="student-card" id="mainCard">
    <div id="formView">
      <div class="header-icon">📝</div>
      <h2 style="font-size: 22px; margin-bottom: 4px;">השארת הערה לשיעור</h2>
      <p style="font-size: 14px; color: var(--text-secondary);">
        ההערה תועבר ישירות לאחראי השיעורים.
      </p>

      <div class="file-badge-container">
        <span class="file-icon">🎵</span>
        <div style="flex: 1;">
          <div style="font-size: 11px; color: var(--text-muted); font-weight: 600;">קובץ שנבחר:</div>
          <div class="file-name" id="displayFilename">טוען קובץ...</div>
        </div>
      </div>

      <form id="noteForm">
        <div class="form-group">
          <label class="form-label" for="noteContent">פירוט ההערה או התיקון הנדרש:</label>
          <textarea 
            id="noteContent" 
            class="form-control" 
            placeholder="לדוגמה: זהו שיעור של הרב ערן היימן בנושא איסור והיתר, שנמסר ביום שלישי..." 
            rows="4" 
            required 
            autofocus
          ></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button type="submit" class="btn btn-primary" id="submitBtn" style="flex: 1;">
            <span>שלח הערה לאחראי</span>
            <span id="spinner" style="display: none;">⏳</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Success View -->
    <div class="success-box" id="successView">
      <div class="success-icon">✓</div>
      <h3 style="font-size: 20px; color: var(--success); margin-bottom: 8px;">ההערה נשלחה בהצלחה!</h3>
      <p style="font-size: 15px; margin-bottom: 24px; color: var(--text-secondary);">
        ההערה הוצמדה לשיעור ותופיע לאחראי השיעורים בלוח הבקרה.
      </p>
      <button class="btn btn-secondary" onclick="window.close();">סגור חלון</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/student.js"></script>
</body>
</html>
