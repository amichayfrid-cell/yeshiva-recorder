<!DOCTYPE html>
<html lang="he" dir="rtl" oncontextmenu="return false;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שיעורי מו"ר הרב צבי קוסטינר | ישיבת מדברה כעדן</title>
  <link rel="stylesheet" href="/static/rav_tzvi.css">
</head>
<body oncontextmenu="return false;">

  <!-- Header -->
  <header class="explorer-header">
    <div class="header-brand">
      <span style="font-size: 24px;">🎙️</span>
      <div>
        <h1 style="font-size: 18px; margin: 0; font-weight: 800;">ספריית שיעורי מו"ר הרב צבי קוסטינר שליט"א</h1>
        <div style="font-size: 12px; color: var(--text-dim);">ישיבת מדברה כעדן • מצפה רמון</div>
      </div>
    </div>
  </header>

  <!-- Toolbar & Breadcrumbs Navigation -->
  <div class="toolbar-container">
    <div class="toolbar-bar">
      <button class="nav-btn" id="backBtn" onclick="navigateBack()" disabled title="חזור לתיקייה הקודמת">
        <span>⬅ חזור</span>
      </button>

      <div class="breadcrumbs-box" id="breadcrumbsContainer">
        <span class="crumb-current">שיעורי הרב צבי</span>
      </div>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="חיפוש בכל הספרייה..." oninput="handleSearch()">
        <span class="search-icon">🔍</span>
      </div>
    </div>
  </div>

  <!-- Main Explorer View -->
  <main class="main-view">
    
    <!-- Folders Section -->
    <div id="foldersSection">
      <div class="section-title">
        <span>📁</span>
        <span>תיקיות וספרים</span>
      </div>
      <div class="folders-grid" id="foldersGrid">
        <!-- Folders injected via JS -->
      </div>
    </div>

    <!-- Files Section -->
    <div id="filesSection">
      <div class="section-title">
        <span>🎵</span>
        <span>שיעורי שמע</span>
      </div>
      <div class="files-container" id="filesList">
        <!-- Audio files injected via JS -->
      </div>
    </div>

    <!-- Empty State View -->
    <div class="empty-view" id="emptyView" style="display: none;">
      <div style="font-size: 40px; margin-bottom: 8px;">📂</div>
      <h3 style="font-size: 16px; margin: 0;">אין פריטים להצגה בתיקייה זו</h3>
    </div>

  </main>

  <!-- Hidden native audio element with nodownload protection -->
  <audio id="audioPlayer" preload="none" controlslist="nodownload" style="display: none;"></audio>

  <!-- Pinned Bottom Audio Player Bar -->
  <footer class="player-bar" id="playerBar">
    <div class="player-track-info">
      <div class="track-name" id="playerTrackName">בחר שיעור להשמעה</div>
      <div class="track-author">הרב צבי קוסטינר שליט"א</div>
    </div>

    <div class="player-controls-center">
      <div class="controls-buttons">
        <button class="ctrl-btn" onclick="seekRelative(-60)" title="דקה אחורה (-1m)">
          <span>1m- ⏩</span>
        </button>
        <button class="ctrl-btn" onclick="seekRelative(-10)" title="10 שניות אחורה (-10s)">
          <span>10s- ⏩</span>
        </button>

        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()" title="הפעל / השהה (מקש רווח)">
          <span id="playIcon">▶</span>
        </button>

        <button class="ctrl-btn" onclick="seekRelative(10)" title="10 שניות קדימה (+10s)">
          <span>⏪ +10s</span>
        </button>
        <button class="ctrl-btn" onclick="seekRelative(60)" title="דקה קדימה (+1m)">
          <span>⏪ +1m</span>
        </button>
      </div>

      <div class="timeline-container">
        <span class="time-label" id="currentTimeLabel">00:00</span>
        <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0" oninput="handleSeek(this.value)">
        <span class="time-label" id="totalDurationLabel">00:00</span>
      </div>
    </div>

    <div class="player-controls-right">
      <!-- Speed selector dropdown -->
      <select class="speed-select" id="speedSelect" onchange="changePlaybackSpeed(this.value)" title="מהירות נגינה">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x (רגיל)</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2.0">2.0x</option>
      </select>

      <div class="volume-container">
        <span style="font-size: 14px; cursor: pointer;" onclick="toggleMute()" id="volumeIcon" title="השתק">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="handleVolume(this.value)" title="עוצמת שמע">
      </div>
    </div>
  </footer>

  <script src="/static/rav_tzvi.js"></script>
</body>
</html>
